<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Squad · NestPicks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Squad standings page for NestPicks: same look as the app, one column, sticky header with period switch. */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F5F7FA; --ink:#121722; --muted:#5D6677; --line:#D8DEE7;
  --accent:#F0A12E; --accent-ink:#1B1406; --good:#1E8E4E; --good-bg:#DDF3E6; --bad:#C2372E; --void:#8A93A3;
  --twig:#8A5A2B; --twig-2:#B57A3E; --gold:#9C6A00; --gold-stroke:0;
  --shadow:0 1px 2px rgba(18,23,34,.06),0 4px 14px rgba(18,23,34,.06);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --panel:#161C25; --panel-2:#1D2430; --ink:#EEF2F7; --muted:#97A1B3; --line:#2A3342;
  --accent:#F3AE47; --good:#4CC57F; --good-bg:#16301F; --bad:#F06A60; --void:#6E7787;
  --twig:#B57A3E; --twig-2:#D69A5A; --gold:#FFD02E; --gold-stroke:.7px #6B4800; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1117; --panel:#161C25; --panel-2:#1D2430; --ink:#EEF2F7; --muted:#97A1B3; --line:#2A3342;
  --accent:#F3AE47; --good:#4CC57F; --good-bg:#16301F; --bad:#F06A60; --void:#6E7787;
  --twig:#B57A3E; --twig-2:#D69A5A; --gold:#FFD02E; --gold-stroke:.7px #6B4800; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--panel)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;flex-direction:column;gap:10px;padding-block:8px 12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.home{display:flex;align-items:center;gap:6px;color:inherit;text-decoration:none;min-width:0}
.logo{display:block;width:40px;height:35px;flex:none}
.wmw{display:flex;flex-direction:column;line-height:1}
.wm{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.wm span{color:var(--accent)}
.made{font-size:10px;font-weight:600;font-style:italic;color:var(--muted);margin-top:2px;white-space:nowrap}
.ctl{display:flex;gap:6px;align-items:center}
.lang{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.lang button{border:0;background:transparent;border-radius:7px;height:30px;padding:0 9px;font-size:13px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.sq{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sq-k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sq h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.sq-n{font-size:13px;color:var(--muted);white-space:nowrap;padding-bottom:3px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{height:34px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;padding:0 4px}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.nav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.nav button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:20px;font-weight:700}
.nav button:disabled{opacity:.35;cursor:default}
.nav-l{text-align:center;min-width:0}
.nav-l b{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-l small{display:block;color:var(--muted);font-size:13px}

/* content */
main{padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.note{border-radius:12px;padding:10px 12px;font-size:14px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));border:1px dashed var(--accent)}
.note.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.note button{margin-left:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.inprog{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.inprog::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.inprog::before{animation:none}}
.board{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.board-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.board-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:0}
.row:first-of-type{border-top:0}
.row-m{display:grid;grid-template-columns:28px 44px 1fr auto;align-items:center;gap:10px;padding:10px 14px}
.row.top .row-m{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.rk{font-family:var(--f-display);font-weight:800;font-size:22px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.row.r1 .rk{color:var(--accent)}
.av{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--panel-2);border:2px solid var(--line)}
.av img{width:100%;height:100%;display:block;object-fit:cover}
.av svg{width:78%;height:auto;margin-top:12%}
.nm{min-width:0}
.nm b{display:flex;align-items:center;gap:4px;font-weight:700;font-size:17px;min-width:0}
.nm b .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nm small{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted);font-size:13px}
.nm small span{display:inline-flex;align-items:center;gap:3px}
.gold{color:var(--gold);-webkit-text-stroke:var(--gold-stroke);font-weight:800}
.pt{text-align:right;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pt small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.row.off .row-m{opacity:.55}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--good);color:#fff;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.chev{display:inline-block;flex:none;transition:transform .15s;color:var(--muted);font-size:12px}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.picks{display:flex;flex-direction:column;gap:6px;padding:0 14px 12px 82px}
.pk{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;font-size:14px}
.pk img{width:28px;height:28px;object-fit:contain}
.pk .abbr{font-family:var(--f-display);font-weight:800;font-size:13px;text-align:center}
.pk .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .who em{font-style:normal;color:var(--muted)}
.chip{min-width:34px;text-align:center;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.chip.c3{background:var(--good);border-color:transparent;color:#fff}
.chip.c1{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.chip.live{color:var(--bad);border-color:var(--bad)}
.three{vertical-align:-3px}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);text-transform:uppercase;margin-bottom:4px}
.btn{height:48px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;width:100%}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.rules{font-size:13px;color:var(--muted);line-height:1.5}
.rules a{color:var(--accent);font-weight:700}
.skel{height:64px;border-top:1px solid var(--line);background:linear-gradient(90deg,transparent,var(--panel-2),transparent);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* picture */
.shot{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.shot img{max-height:72vh;width:auto;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.shot .acts{display:flex;gap:10px;width:min(100%,360px)}
.shot p{color:#fff;margin:0;font-size:14px;text-align:center}
.snap{position:fixed;left:-99999px;top:0}
.sy{width:1080px;height:1920px;background:#0B0F16;color:#EEF2F7;font-family:var(--f-body);padding:90px 80px 70px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sy-top{display:flex;align-items:center;gap:16px}
.sy-wm{font-family:var(--f-display);font-weight:800;font-size:54px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.sy-wm span{color:#F3AE47}
.sy-made{font-size:22px;font-style:italic;font-weight:600;color:#97A1B3;margin-top:4px}
.sy-k{margin-top:70px;font-size:30px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#F3AE47}
.sy-t{font-family:var(--f-display);font-weight:800;font-size:132px;line-height:.92;text-transform:uppercase;margin-top:8px}
.sy-p{font-family:var(--f-display);font-weight:600;font-size:46px;text-transform:uppercase;color:#97A1B3;margin-top:14px;letter-spacing:.03em}
.sy-list{margin-top:50px;display:flex;flex-direction:column;gap:14px}
.sy-r{display:grid;grid-template-columns:70px 104px 1fr 190px;align-items:center;gap:22px;background:#161C25;border:2px solid #2A3342;border-radius:26px;padding:14px 26px}
.sy-r.r1{border-color:#F3AE47;background:#221B0E}
.sy-rk{font-family:var(--f-display);font-weight:800;font-size:58px;text-align:center;color:#97A1B3}
.sy-r.r1 .sy-rk{color:#F3AE47}
.sy-av{width:104px;height:104px;border-radius:50%;overflow:hidden;background:#1D2430;border:3px solid #2A3342;display:grid;place-items:center}
.sy-av img{display:block}
.sy-nm{font-weight:700;font-size:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.sy-nm small{display:block;font-size:26px;font-weight:600;color:#97A1B3}
.sy .gold{color:#FFD02E;-webkit-text-stroke:1px #6B4800}
.sy-pt{text-align:right;font-family:var(--f-display);font-weight:800;font-size:84px;line-height:1}
.sy-pt small{display:block;font-family:var(--f-body);font-size:22px;font-weight:700;letter-spacing:.08em;color:#97A1B3}
.sy-more{font-size:30px;color:#97A1B3;text-align:center;margin-top:6px}
.sy-wait{display:inline-block;margin-top:20px;font-size:30px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#C2372E;color:#fff;border-radius:999px;padding:8px 24px;align-self:flex-start}
.sy-foot{margin-top:auto;text-align:center;font-family:var(--f-display);font-weight:800;font-size:56px;text-transform:uppercase;letter-spacing:.03em;color:#F3AE47}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand">
    <div class="home" id="home"></div>
    <div class="ctl">
      <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
      <button class="icon-btn" id="themeBtn" aria-label="Theme"></button>
    </div>
  </div>
  <div class="sq"><div><div class="sq-k" id="sqK"></div><h1 id="sqTitle"></h1></div><div class="sq-n" id="sqN"></div></div>

</div></header>

/* ---------- dates: a game day = one US (Eastern) slate, labelled by the morning after ---------- */
function etDate(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(d).replace(/-/g,'');}
function currentNight(){return etDate(new Date(Date.now()-6*3600e3));}
function keyToDate(k){return new Date(Date.UTC(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8),12));}
function addDays(k,n){const d=keyToDate(k);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10).replace(/-/g,'');}
const wakeKey=k=>addDays(k,1);
const fmt=(k,o)=>keyToDate(wakeKey(k)).toLocaleDateString(LOC(),Object.assign({timeZone:'UTC'},o));
const dayLabel=k=>fmt(k,{weekday:'short',day:'numeric',month:'short'});
const shortLabel=k=>fmt(k,{day:'numeric',month:'short'});
const monthLabel=k=>{const m=fmt(k,{month:'long'});return m.charAt(0).toUpperCase()+m.slice(1)+' '+wakeKey(k).slice(0,4);};
function weekStart(k){const w=keyToDate(wakeKey(k));const off=(w.getUTCDay()+6)%7;return addDays(k,-off);}
function monthRange(k){const w=wakeKey(k);const first=w.slice(0,6)+'01';const nx=keyToDate(first);nx.setUTCMonth(nx.getUTCMonth()+1);
  const nf=nx.toISOString().slice(0,10).replace(/-/g,'');return [addDays(first,-1),addDays(nf,-2)];}

try{const c=JSON.parse(localStorage.getItem(STORE+'.res')||'{}');for(const k in c)N[k]=c[k];}catch(e){}
function saveRes(){const o={};for(const k in N)if(N[k].final)o[k]=N[k];
  try{localStorage.setItem(STORE+'.res',JSON.stringify(o));}catch(e){try{localStorage.removeItem(STORE+'.res');}catch(_){}}}

function range(){
  const today=currentNight();
  if(view==='day')return [cur,cur];
  if(view==='week'){const s=weekStart(cur);return [s,addDays(s,6)];}
  if(view==='month')return monthRange(cur);
  return [START,today];
}
const clampFrom=r=>view==='day'?r[0]:(r[0]<START?START:r[0]);
function keysIn(a,b){const out=[];const end=b<currentNight()?b:currentNight();for(let k=a;k<=end;k=addDays(k,1))out.push(k);return out;}

/* ---------- data ---------- */
async function rpc(fn,args){
  const h={'Content-Type':'application/json','apikey':SUPABASE_KEY};
  if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;
  const r=await fetch(SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});
  const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null;}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||('Server error '+r.status));
  return j;
}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}
function normTeam(c){const tm=c.team||{};return{id:String(tm.id),abbr:tm.abbreviation,name:tm.shortDisplayName||tm.name,logo:tm.logo||'',score:c.score!=null?+c.score:null,winner:!!c.winner};}
function normEvent(e){const c=e.competitions[0];const h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');return{id:String(e.id),start:e.date,state:e.status.type.state,home:normTeam(h),away:normTeam(a)};}
async function fetchBox(gid){
  const j=await getJSON(API+'/summary?event='+gid);const out={};
  ((j.boxscore&&j.boxscore.players)||[]).forEach(tm=>{const st=(tm.statistics||[])[0];if(!st)return;
    let i=(st.labels||[]).indexOf('PTS');if(i<0)i=(st.keys||[]).indexOf('points');
    out[String(tm.team.id)]=(st.athletes||[]).map(a=>({id:String(a.athlete.id),name:a.athlete.displayName,pts:i>=0&&a.stats&&a.stats[i]!=null?(parseInt(a.stats[i],10)||0):0})).filter(p=>p.pts>0);});
  return out;
}
async function pool(items,n,fn){let i=0;const run=async()=>{while(i<items.length){const it=items[i++];try{await fn(it);}catch(e){}}};await Promise.all(Array.from({length:Math.min(n,items.length)},run));}
async function ensureNight(k){
  const d=N[k]||(N[k]={games:[],box:{}});
  if(d.final)return;
  const j=await getJSON(API+'/scoreboard?dates='+k);
  d.games=(j.events||[]).map(normEvent).sort((a,b)=>a.start.localeCompare(b.start));
  d.box=d.box||{};
  const need=d.games.filter(g=>g.state!=='pre'&&(g.state==='in'||!d.box[g.id]));
  await pool(need,4,async g=>{d.box[g.id]=await fetchBox(g.id);});
  d.final=d.games.length>0&&d.games.every(g=>g.state==='post'&&d.box[g.id]);
  d.at=Date.now();
}
async function loadSquad(){
  if(sq.loading)return;sq.loading=true;
  try{const r=await rpc('cp_squad',{p_squad:SQUAD,p_from:FETCH_FROM})||{};sq.members=r.members||[];sq.nights=r.nights||{};sq.err='';sq.at=Date.now();}
  catch(e){sq.err=String(e.message||e);}
  sq.loading=false;render();loadResults();
}
async function loadResults(){
  if(!sq.nights||resLoading)return;
  const r=range();const ks=keysIn(clampFrom(r),r[1]).filter(k=>sq.nights[k]&&!(N[k]&&N[k].final));
  if(!ks.length){schedule();return;}
  resLoading=true;render();
  await pool(ks,3,ensureNight);
  resLoading=false;saveRes();render();schedule();
}
function schedule(){
  clearTimeout(timer);
  const k=currentNight(),d=N[k];const r=range();
  if(!(r[0]<=k&&k<=r[1]))return;
  const soon=d&&d.games.some(g=>g.state==='in'||(g.state==='pre'&&new Date(g.start)-Date.now()<3600e3));
  if(soon||!d)timer=setTimeout(()=>{if(N[k]&&!N[k].final)N[k].final=false;loadSquad();},soon?60e3:180e3);
}

/* ---------- scoring (same rules as the app) ---------- */
function winnerId(g){if(g.state!=='post')return null;if(g.home.winner)return g.home.id;if(g.away.winner)return g.away.id;return g.home.score>g.away.score?g.home.id:g.away.id;}
function evalPick(d,g,p){
  if(!p||!p.team)return null;
  const w=winnerId(g);const r={team:w?(p.team===w?'right':'wrong'):'pending',scorer:p.player?'pending':null,pts:null,tops:[]};
  const box=d.box[g.id]&&d.box[g.id][p.team];
  if(box&&box.length){const max=Math.max(...box.map(x=>x.pts));r.tops=box.filter(x=>x.pts===max);
    if(p.player){const me=box.find(x=>x.id===p.player);r.pts=me?me.pts:0;}
    if(w&&p.player){r.scorer=r.tops.some(x=>x.id===p.player)?'right':'wrong';}}
  r.points=null;
  if(w){if(!p.player)r.points=r.team==='right'?1:0;
    else if(r.scorer!=='pending'){const T=r.team==='right',P=r.scorer==='right';r.points=T&&P?3:(T||P)?1:0;}}
  return r;
}
function tallyPicks(d,picks){let pts=0,max=0,threes=0;(d.games||[]).forEach(g=>{const p=picks[g.id];const r=evalPick(d,g,p);if(!r||r.points==null)return;
  pts+=r.points;max+=p.player?3:1;if(r.points===3)threes++;});return{pts,max,threes};}
const cmp=(a,b)=>b.pts-a.pts||b.threes-a.threes;

function dayRows(k){
  const raw=(sq.nights&&sq.nights[k])||{};const d=N[k];
  return (sq.members||[]).map(m=>{const picks=raw[m.key];const row={...m,inDay:picks!==undefined,picks:picks||{},pts:0,threes:0,max:0};
    row.has=Object.keys(row.picks).length>0;if(d&&row.has)Object.assign(row,tallyPicks(d,row.picks));return row;});
}
function dayWinners(rows){const act=rows.filter(r=>r.has);const max=Math.max(0,...act.map(r=>r.pts));if(max<=0)return new Set();
  const top=act.filter(r=>r.pts===max);const m3=Math.max(...top.map(r=>r.threes));return new Set(top.filter(r=>r.threes===m3).map(r=>r.key));}
function periodStats(){
  const r=range();const from=clampFrom(r);const out={};
  (sq.members||[]).forEach(m=>out[m.key]={...m,pts:0,threes:0,wins:0,days:0});
  let pending=false,counted=0;
  keysIn(from,r[1]).forEach(k=>{if(!sq.nights[k])return;const d=N[k];
    if(!d||!d.final){if(d&&d.games.length)pending=true;return;}
    counted++;const rows=dayRows(k);const win=dayWinners(rows);
    rows.forEach(x=>{if(!x.has)return;const o=out[x.key];o.pts+=x.pts;o.threes+=x.threes;o.days++;if(win.has(x.key))o.wins++;});});
  return {list:Object.values(out).sort((a,b)=>cmp(a,b)||b.wins-a.wins||a.name.localeCompare(b.name)),pending,counted,from,to:r[1]};
}
function ranks(list,active){let rk=0,prev=null;return list.map((x,i)=>{if(!active(x))return '';if(!prev||cmp(prev,x)!==0)rk=i+1;prev=x;return rk;});}

/* ---------- artwork ---------- */
const BIRDS={blue:['#3B82C4','#CFE6F7','#2C6399'],robin:['#6B4A35','#E8743B','#51382A'],yellow:['#F2C230','#FFF1B8','#C99A16'],green:['#3E9E5A','#D7F0CF','#2C7543'],pink:['#E46A9A','#FBDCE8','#B84A78'],purple:['#7B5BC9','#E3DAF8','#5A3FA0']};
const AVATARS=Object.keys(BIRDS);
function hashN(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h;}
const birdKind=p=>AVATARS.includes(p.avatar)?p.avatar:AVATARS[hashN(p.key)%AVATARS.length];
function birdSVG(kind){const c=BIRDS[kind]||BIRDS.blue;
  return `<svg viewBox="0 0 40 36" aria-hidden="true"><path d="M7 19 L1 15 L3 22 Z" fill="${c[2]}"/><path d="M15 31 v4 M21 31 v4" stroke="#C47A2C" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="18" cy="22" rx="12" ry="10" fill="${c[0]}"/><ellipse cx="21" cy="25" rx="7.5" ry="6.5" fill="${c[1]}"/><path d="M10 20 q6 -3 9 3 q-5 4 -9 -3 z" fill="${c[2]}"/><circle cx="25" cy="13" r="8" fill="${c[0]}"/><path d="M32 12 L38 14.5 L32 16 Z" fill="#F08A24"/><circle cx="27.5" cy="11.5" r="2.1" fill="#16120E"/><circle cx="28.2" cy="10.8" r=".7" fill="#fff"/><circle cx="26.5" cy="16" r="1.6" fill="#F4A3A3" opacity=".6"/></svg>`;}
function nestSVG(cls,tw,tw2){return `<svg class="${cls||'logo'}" viewBox="0 0 48 42" aria-hidden="true"><circle cx="24" cy="15" r="11" fill="#E8772E"/><path d="M24 4 v22 M13 15 h22 M16 7 q5 8 0 16 M32 7 q-5 8 0 16" stroke="#5A2A0C" stroke-width="1.4" fill="none"/><path d="M3 20 Q24 30 45 20 Q43 37 24 39 Q5 37 3 20 Z" fill="${tw||'var(--twig)'}"/><path d="M5 23 Q24 31 43 23 M6 28 Q24 35 42 28 M9 33 Q24 38 39 33" stroke="${tw2||'var(--twig-2)'}" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M2 21 L10 25 M46 21 L38 25 M14 36 L20 32 M34 36 L28 32" stroke="${tw2||'var(--twig-2)'}" stroke-width="1.4" stroke-linecap="round"/></svg>`;}
function threeSVG(sz,net){return `<svg class="three" width="${sz}" height="${sz}" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 17 L11 30 M12 18 L14 30 M16 18.5 L16 30 M20 18 L18 30 M25 17 L21 30 M8.5 22 L23.5 22 M10 26.5 L22 26.5" stroke="${net||'currentColor'}" stroke-width="1.3" fill="none" opacity=".95"/><circle cx="16" cy="9" r="6.5" fill="#E8772E" stroke="#5A2A0C" stroke-width="1"/><path d="M16 2.5 v13 M9.5 9 h13 M11.5 4 q3.5 5 0 10 M20.5 4 q-3.5 5 0 10" stroke="#5A2A0C" stroke-width=".9" fill="none"/><ellipse cx="16" cy="16.5" rx="11" ry="3" fill="none" stroke="#FF7A1A" stroke-width="2.6"/></svg>`;}
function svgImg(svg,w,h){const s=svg.replace(/class="[^"]*"/g,'').replace(/<svg\s/,`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `);
  return `<img alt="" width="${w}" height="${h}" style="width:${w}px;height:${h}px" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(s)}">`;}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO=tm=>tm.logo||(tm.abbr?'https://a.espncdn.com/i/teamlogos/nba/500/'+String(tm.abbr).toLowerCase()+'.png':'');
const isStar=k=>STARS.includes(k);
function avatarHTML(p){return `<span class="av">${PHOTOS[p.key]?`<img src="${PHOTOS[p.key]}" alt="">`:birdSVG(birdKind(p))}</span>`;}
function nameHTML(p){return `<span class="n${isStar(p.key)?' gold':''}">${esc(p.name)}</span>`;}
const ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';

/* ---------- theme ---------- */
const darkNow=()=>P.theme==='dark'||(P.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){if(P.theme)document.documentElement.setAttribute('data-theme',P.theme);else document.documentElement.removeAttribute('data-theme');
  $('themeBtn').innerHTML=darkNow()?ICON_SUN:ICON_MOON;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=darkNow()?'#161C25':'#FFFFFF';}

/* ---------- render ---------- */
function renderHeader(){
  document.documentElement.lang=L();
  document.title=squadName()+' · NestPicks';
  $('home').innerHTML=nestSVG('logo')+'<span class="wmw"><span class="wm">Nest<span>Picks</span></span><small class="made">made by Nestor Dyachok</small></span>';
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===L()));
  $('themeBtn').setAttribute('aria-label',t('theme'));$('themeBtn').title=t('theme');
  $('sqK').textContent=t('squad');$('sqTitle').textContent=squadName();
  $('sqN').textContent=sq.members?t('members',sq.members.length):'';
  $('seg').innerHTML=['day','week','month','all'].map(v=>`<button role="tab" data-v="${v}" aria-selected="${v===view}">${esc(t(v))}</button>`).join('');
  const r=range(),today=currentNight();
  let b='',s='';
  if(view==='day'){b=cur===today?t('today'):cur===addDays(today,-1)?t('yesterday'):dayLabel(cur);s=cur===today||cur===addDays(today,-1)?dayLabel(cur):'';}
  else if(view==='week'){b=shortLabel(r[0])+' – '+shortLabel(r[1]);s=r[1]<START?t('beforeStart'):'';}
  else if(view==='month'){b=monthLabel(r[1]);s=r[1]<START?t('beforeStart'):'';}
  else{b=t('all');s=t('since',shortLabel(START));}
  $('navB').textContent=b;$('navS').textContent=s;$('navS').hidden=!s;
  const minK=view==='day'?FETCH_FROM:START;
  $('prev').disabled=view==='all'||r[0]<=minK;$('next').disabled=view==='all'||r[1]>=today;
  $('prev').style.visibility=$('next').style.visibility=view==='all'?'hidden':'';
  $('shotSave').textContent=t('save');$('shotClose').textContent=t('close');
}
function chipHTML(g,r){
  if(r&&r.points!=null)return `<span class="chip${r.points===3?' c3':r.points===1?' c1':''}">${r.points===3?'+3':r.points===1?'+1':'0'}</span>`;
  if(g.state==='in')return `<span class="chip live">${esc(t('live'))}</span>`;
  return '<span class="chip">…</span>';
}
function picksHTML(d,row){
  const items=d.games.filter(g=>row.picks[g.id]).map(g=>{const p=row.picks[g.id];const tm=g.home.id===p.team?g.home:g.away.id===p.team?g.away:null;if(!tm)return '';
    const r=evalPick(d,g,p);const lg=LOGO(tm);
    const ptsTxt=r&&r.pts!=null&&p.player?` <em>· ${r.pts}</em>`:'';
    return `<div class="pk">${lg?`<img src="${esc(lg)}" alt="${esc(tm.abbr)}" loading="lazy">`:`<span class="abbr">${esc(tm.abbr)}</span>`}<span class="who">${esc(tm.name)}${p.playerName?` <em>·</em> ${esc(p.playerName)}${ptsTxt}`:''}</span>${chipHTML(g,r)}</div>`;}).join('');
  return items?`<div class="picks">${items}</div>`:'';
}
function dayView(){
  const k=cur,d=N[k];const nightRows=sq.nights[k];
  if(!nightRows)return `<section class="board"><div class="empty"><b>${esc(t('noPicks'))}</b>${esc(t('noneYet'))}</div></section>`;
  if(!d)return `<section class="board"><div class="board-h"><h2>${esc(t('dayBoard'))}</h2></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></section>`;
  const rows=dayRows(k);const final=d.final;const win=final?dayWinners(rows):new Set();
  const order=rows.slice().sort((a,b)=>(b.has-a.has)||(b.inDay-a.inDay)||cmp(a,b)||a.name.localeCompare(b.name));
  const rk=ranks(order,x=>x.has);
  const anyLive=!final&&d.games.length;
  const html=order.map((x,i)=>{
    let sub='';
    if(x.has)sub=`<span>${threeSVG(16)} ${esc(t('threes',x.threes))}</span>${win.has(x.key)?`<span class="tag">${esc(t('dayWin'))}</span>`:''}`;
    else sub=`<span>${esc(x.inDay?t('hidden'):t('noPicks'))}</span>`;
    const exp=openRows.has(x.key);
    return `<button class="row${x.has?'':' off'}${rk[i]===1&&final&&x.pts>0?' top r1':''}" data-row="${esc(x.key)}" aria-expanded="${x.has?exp:false}"${x.has?'':' disabled'}>
      <span class="row-m"><span class="rk">${rk[i]||'–'}</span>${avatarHTML(x)}<span class="nm"><b>${nameHTML(x)}${x.has?'<span class="chev">▶</span>':''}</b><small>${sub}</small></span>
      <span class="pt">${x.has?x.pts:''}${x.has?`<small>${esc(t('pts'))}</small>`:''}</span></span>${x.has&&exp?picksHTML(d,x):''}</button>`;}).join('');
  return `<section class="board"><div class="board-h"><h2>${esc(t('dayBoard'))}</h2>${anyLive?`<span class="inprog">${esc(t('inProgress'))}</span>`:''}</div>${html}</section>`;
}
function periodView(){
  const r=range();
  if(r[1]<START)return `<section class="board"><div class="empty"><b>${esc(t('beforeStart'))}</b>${esc(t('startsOn',dayLabel(START)))}</div></section>`;
  const st=periodStats();
  const head=`<div class="board-h"><h2>${esc(t('standings'))}</h2>${st.pending?`<span class="inprog">${esc(t('inProgress'))}</span>`:''}</div>`;
  if(resLoading&&!st.counted)return `<section class="board">${head}<div class="skel"></div><div class="skel"></div><div class="skel"></div></section>`;
  if(!st.counted)return `${st.pending?`<div class="note">${esc(t('notCounted'))}</div>`:''}<section class="board">${head}<div class="empty">${esc(view==='all'&&currentNight()<START?t('startsOn',dayLabel(START)):t('emptyPeriod'))}</div></section>`;
  const rk=ranks(st.list,x=>x.days>0);
  const rows=st.list.map((x,i)=>`<div class="row${x.days?'':' off'}${rk[i]===1&&x.pts>0?' top r1':''}"><span class="row-m"><span class="rk">${rk[i]||'–'}</span>${avatarHTML(x)}<span class="nm"><b>${nameHTML(x)}</b><small>${x.days?`<span>${threeSVG(16)} ${esc(t('threes',x.threes))}</span><span>${esc(t('wins',x.wins))}</span><span>${esc(t('days',x.days))}</span>`:`<span>${esc(t('noPicks'))}</span>`}</small></span><span class="pt">${x.days?x.pts:''}${x.days?`<small>${esc(t('pts'))}</small>`:''}</span></span></div>`).join('');
  return `${st.pending?`<div class="note">${esc(t('notCounted'))}</div>`:''}<section class="board">${head}${rows}</section>`;
}
function canSave(){
  if(!sq.members||!sq.members.length)return false;
  if(view==='day'){const d=N[cur];return !!(d&&dayRows(cur).some(x=>x.has));}
  if(range()[1]<START)return false;
  return periodStats().counted>0;
}
function render(){
  renderHeader();
  let h='';
  if(sq.err&&!sq.members)h=`<div class="note err">${esc(t('err'))}<button data-act="retry">${esc(t('retry'))}</button></div>`;
  else if(!sq.members)h=`<section class="board"><div class="skel"></div><div class="skel"></div><div class="skel"></div></section>`;
  else if(!sq.members.length)h=`<section class="board"><div class="empty"><b>${esc(t('noMembers'))}</b>${esc(t('noMembersTxt'))}</div></section>`;
  else{
    if(sq.err)h+=`<div class="note err">${esc(t('err'))}<button data-act="retry">${esc(t('retry'))}</button></div>`;
    h+=view==='day'?dayView():periodView();
    h+=`<button class="btn" data-act="save"${canSave()?'':' disabled'}>${esc(t('save'))}</button>`;
  }
  h+=`<p class="rules">${esc(t('rules'))}</p>`;
  $('main').innerHTML=h;
}

/* ---------- picture ---------- */
async function toDataURL(url){let r;
  try{r=await fetch(url,{mode:'cors'});if(!r.ok)throw 0;}
  catch(e){r=await fetch('https://wsrv.nl/?url='+encodeURIComponent(url),{mode:'cors'});if(!r.ok)throw new Error('img');}
  const b=await r.blob();
  return await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b);});}
function storyHTML(){
  let list,sub,wait=false;
  if(view==='day'){const d=N[cur];const rows=dayRows(cur).filter(x=>x.has).sort((a,b)=>cmp(a,b)||a.name.localeCompare(b.name));list=rows;sub=dayLabel(cur);wait=!d.final;}
  else{const st=periodStats();list=st.list.filter(x=>x.days>0);wait=st.pending;
    const r=range();sub=view==='week'?shortLabel(r[0])+' – '+shortLabel(r[1]):view==='month'?monthLabel(r[1]):t('since',shortLabel(START));}
  const rk=ranks(list,()=>true);const MAX=9;const shown=list.slice(0,MAX);
  const rows=shown.map((x,i)=>{const av=PHOTOS[x.key]?`<img src="${PHOTOS[x.key]}" width="104" height="104" style="width:104px;height:104px;object-fit:cover">`:svgImg(birdSVG(birdKind(x)),82,74);
    const s2=view==='day'?t('threes',x.threes):t('threes',x.threes)+' · '+t('wins',x.wins);
    return `<div class="sy-r${rk[i]===1&&x.pts>0?' r1':''}"><div class="sy-rk">${rk[i]}</div><div class="sy-av">${av}</div><div class="sy-nm"><span class="${isStar(x.key)?'gold':''}">${esc(x.name.length>16?x.name.slice(0,15).trim()+'…':x.name)}</span><small>${esc(s2)}</small></div><div class="sy-pt">${x.pts}<small>${esc(t('pts').toUpperCase())}</small></div></div>`;}).join('');
  return `<div class="sy"><div class="sy-top">${svgImg(nestSVG('','#B57A3E','#D69A5A'),96,84)}<div><div class="sy-wm">Nest<span>Picks</span></div><div class="sy-made">made by Nestor Dyachok</div></div></div>
    <div class="sy-k">${esc(t('squad'))} · ${esc(t(view))}</div><div class="sy-t">${esc(squadName())}</div><div class="sy-p">${esc(sub)}</div>
    ${wait?`<div class="sy-wait">${esc(t('inProgress'))}</div>`:''}
    <div class="sy-list">${rows}</div>${list.length>MAX?`<div class="sy-more">${esc(t('andMore',list.length-MAX))}</div>`:''}
    <div class="sy-foot">${esc(t('tagline'))}</div></div>`;
}
let making=false,shotFile=null;
async function makeStory(btn){
  if(!window.html2canvas||making)return;making=true;
  btn.disabled=true;btn.textContent=t('making');
  const box=document.createElement('div');box.className='snap';box.innerHTML=storyHTML();document.body.appendChild(box);
  try{try{await document.fonts.ready;}catch(e){}
    await Promise.all([...box.querySelectorAll('img')].map(im=>im.decode().catch(()=>{})));
    const c=await html2canvas(box.firstElementChild,{scale:1,backgroundColor:'#0B0F16',width:1080,height:1920});
    $('shotImg').src=c.toDataURL('image/png');$('shotMsg').hidden=true;$('shotSave').disabled=true;shotFile=null;$('shot').hidden=false;
    c.toBlob(b=>{if(!b)return;shotFile=new File([b],'nestpicks-'+SQUAD+'-'+view+'-'+cur+'.png',{type:'image/png'});$('shotSave').disabled=false;},'image/png');}
  catch(e){$('shot').hidden=true;}
  finally{box.remove();making=false;btn.disabled=false;btn.textContent=t('save');}
}
async function saveShot(){
  if(!shotFile)return;
  const msg=m=>{$('shotMsg').textContent=m;$('shotMsg').hidden=false;};
  try{if(navigator.canShare&&navigator.canShare({files:[shotFile]})){await navigator.share({files:[shotFile]});return;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(shotFile);a.download=shotFile.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg(t('saved'));}
  catch(e){msg(t('cantSave'));}
}

/* ---------- events ---------- */
function step(dir){
  const r=range();
  if(view==='day')cur=addDays(cur,dir);
  else if(view==='week')cur=addDays(cur,7*dir);
  else if(view==='month')cur=dir<0?addDays(r[0],-1):addDays(r[1],1);
  const today=currentNight();if(cur>today)cur=today;if(cur<FETCH_FROM)cur=FETCH_FROM;
  openRows.clear();render();loadResults();
}
document.addEventListener('click',e=>{
  const lg=e.target.closest('[data-lang]');if(lg){P.lang=lg.dataset.lang;savePrefs();render();return;}
  const v=e.target.closest('[data-v]');if(v){view=v.dataset.v;P.view=view;savePrefs();openRows.clear();render();loadResults();return;}
  const row=e.target.closest('[data-row]');if(row&&!row.disabled){const k=row.dataset.row;openRows.has(k)?openRows.delete(k):openRows.add(k);render();return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='retry'){sq.err='';render();loadSquad();}
  if(a.dataset.act==='save')makeStory(a);
});
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('themeBtn').onclick=()=>{P.theme=darkNow()?'light':'dark';savePrefs();applyTheme();};
$('shotClose').onclick=()=>{$('shot').hidden=true;};
$('shotSave').onclick=saveShot;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-sq.at>60e3)loadSquad();});

applyTheme();render();loadSquad();
})();
</script>
